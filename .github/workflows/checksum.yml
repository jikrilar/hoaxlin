name: Private BERT v1.0.0 release validation

# Never run private artifacts or registry credentials on push / pull_request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Configure required reviewers and default-branch-only deployment protection.
    environment: bert-release
    env:
      # Private image, pinned by digest; never uploaded by this workflow.
      RELEASE_IMAGE: ${{ vars.BERT_RELEASE_IMAGE }}
    steps:
      - name: Require an immutable private image reference
        shell: bash
        run: |
          if [[ ! "$RELEASE_IMAGE" =~ ^[^[:space:]]+@sha256:[a-f0-9]{64}$ ]]; then
            echo 'Configure BERT_RELEASE_IMAGE with a private image pinned by sha256 digest.' >&2
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.BERT_REGISTRY }}
          username: ${{ secrets.BERT_REGISTRY_USERNAME }}
          password: ${{ secrets.BERT_REGISTRY_PASSWORD }}
      - name: Pull private release image
        run: docker pull "$RELEASE_IMAGE"
      - name: Validate embedded manifest, checksums, and frozen version
        run: |
          docker run --rm --network none --entrypoint python "$RELEASE_IMAGE" -c \
            "from pathlib import Path; from app.model_release import validate_release; validate_release(Path('/app/models/indobert-hoax/v1.0.0'), expected_version='v1.0.0'); print('BERT v1.0.0 release checksums OK')"
      - name: Validate offline runtime and frozen inference fixtures
        shell: bash
        run: |
          BERT_INTERNAL_API_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$BERT_INTERNAL_API_TOKEN"
          export BERT_INTERNAL_API_TOKEN
          docker run -d --name bert-release-check --network none \
            -e BERT_INTERNAL_API_TOKEN "$RELEASE_IMAGE"
          docker exec bert-release-check python /app/runtime_smoke_test.py
      - name: Remove private test container and image
        if: always()
        shell: bash
        run: |
          docker rm -f bert-release-check 2>/dev/null || true
          if [[ -n "$RELEASE_IMAGE" ]]; then
            docker image rm "$RELEASE_IMAGE" 2>/dev/null || true
          fi
