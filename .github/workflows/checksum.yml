name: checksum
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q -r bert-service/requirements.txt
      - run: python -c "import json, hashlib, pathlib; m=json.loads(pathlib.Path('models/indobert-hoax/manifest.json').read_text()); e=m[0]; [print(k) or exit(1) if hashlib.sha256(pathlib.Path(f'models/indobert-hoax/v1.0.0/{k}').read_bytes()).hexdigest()!=v else None for k,v in e['files'].items()]"
