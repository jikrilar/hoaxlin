[project]
name = "hoax-bert-service"
version = "0.1.0"
description = "FastAPI inference service for the Indonesian BERT hoax classifier."
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.136.1,<0.137.0",
    "transformers==5.14.1",
    "torch==2.13.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "datasets>=3.0",
    "accelerate>=1.0",
    "matplotlib>=3.8",
]
train = [
    "datasets>=3.0",
    "accelerate>=1.0",
    "matplotlib>=3.8",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
