name: Public CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check whitespace
        run: git show --format= --check HEAD
      - name: Check workflows
        # Run actionlint without giving a third-party container the checkout token.
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.11 -color
      - name: Check Compose without production secrets or services
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_PASSWORD: ci-only-database
          MYSQL_ROOT_PASSWORD: ci-only-root
          BERT_SERVICE_TOKEN: ci-only-bert
        run: docker compose --env-file /dev/null config --quiet

  laravel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build isolated test image (includes npm ci and frontend build)
        run: docker build --target test -t hoaxlin-app:ci-test .
      - name: Build production application target (no BERT artifact required)
        run: docker build --target application -t hoaxlin-app:ci .
      - name: Check PHP formatting
        run: docker run --rm --network none hoaxlin-app:ci-test vendor/bin/pint --test
      - name: Run Laravel tests without external services
        run: |
          docker run --rm --network none \
            -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            hoaxlin-app:ci-test

  bert-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    defaults:
      run:
        working-directory: bert-service
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bert-service/requirements*.txt
      - name: Install CPU-only test dependencies (no training or weights)
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          python -m pip install -r requirements-test.txt
      - name: Run all public BERT tests, including synthetic checksum tests
        run: python -m pytest -m 'not release'

  rag-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rag-service/requirements-test.txt
      - name: Install lightweight test dependencies
        run: python -m pip install -r rag-service/requirements-test.txt
      - name: Run RAG tests with injected embeddings
        working-directory: rag-service
        run: python -m pytest tests
      - name: Check knowledge base tooling without changing snapshots
        run: |
          python scripts/validate_rag_knowledge_base.py
          python -m unittest discover -s tests/rag -p 'test_*.py'

  frontend-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Run frontend unit tests (Node built-ins only)
        run: node --test tests/Frontend/*.test.mjs
